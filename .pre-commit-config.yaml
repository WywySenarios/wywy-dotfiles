# Pre-commit hooks for wywy-dotfiles.
#
# Install once per clone:  pre-commit install
# Run against everything:  pre-commit run --all-files
repos:
  - repo: https://github.com/betterleaks/betterleaks
    rev: v1.9.0
    hooks:
      - id: betterleaks

  - repo: local
    hooks:
      - id: shell
        name: shell checks
        entry: scripts/tests/shell.sh
        language: system
        pass_filenames: false
        files: ^(scripts/|Jenkinsfile$)
      - id: ansible-lint
        name: ansible-lint
        entry: scripts/tests/ansible/lint.sh
        language: system
        pass_filenames: false
        files: &ansible-files ^(ansible\.cfg|\.ansible-lint|inventory/|playbooks/|roles/|pyproject\.toml|uv\.lock|scripts/tests/ansible/)
      - id: ansible-syntax
        name: ansible-playbook --syntax-check
        entry: scripts/tests/ansible/syntax.sh
        language: system
        pass_filenames: false
        files: *ansible-files
