---
- name: Provision the operator machine
  hosts: localhost
  become: false
  pre_tasks:
    - name: Check the target platform
      ansible.builtin.assert:
        that:
          - ansible_architecture == "x86_64"
          - ansible_distribution == "Debian"
          - ansible_distribution_major_version == "13"
        fail_msg: >-
          Unsupported platform {{ ansible_distribution }}
          {{ ansible_distribution_major_version }} {{ ansible_architecture }};
          this playbook targets Debian 13 on x86_64 only.
  roles:
    - docker_repo
    - packages
    - firefox_profile
    - docker_group
    - proxmox_repo
    - binaries
    - disable_suspend
