---
- name: Ensure required apt packages are present
  ansible.builtin.apt:
    name: "{{ packages_required }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Link provisioned apt executables into ~/.local/bin
  ansible.builtin.include_role:
    name: path_links
  vars:
    path_links_links: "{{ packages_path_links }}"
