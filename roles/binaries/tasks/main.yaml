---
- name: Ensure the userland tool root exists
  ansible.builtin.file:
    path: "{{ binaries_opt_root }}"
    state: directory
    mode: "0755"

- name: Probe the installed sops version
  ansible.builtin.command:
    argv:
      - "{{ binaries_opt_root }}/sops/sops"
      - --version
  register: binaries_sops_probe
  changed_when: false
  failed_when: false

- name: Record the installed sops version
  ansible.builtin.set_fact:
    binaries_sops_installed: >-
      {{ (binaries_sops_probe.stdout.split()[1] | regex_replace('^v', ''))
         if (binaries_sops_probe.rc == 0 and binaries_sops_probe.stdout.split() | length >= 2)
         else '' }}

- name: Decide whether sops needs installing
  ansible.builtin.set_fact:
    binaries_sops_needs_install: >-
      {{ ((binaries_sops_installed == '')
          or (binaries_sops_installed is version(binaries_sops_version, '<'))) | bool }}

- name: Probe the installed helm version
  ansible.builtin.command:
    argv:
      - "{{ binaries_opt_root }}/helm/helm"
      - version
      - --short
  register: binaries_helm_probe
  changed_when: false
  failed_when: false

- name: Record the installed helm version
  ansible.builtin.set_fact:
    binaries_helm_installed: >-
      {{ (binaries_helm_probe.stdout.split()[0] | regex_replace('^v', '') | regex_replace('\+.*$', ''))
         if (binaries_helm_probe.rc == 0 and binaries_helm_probe.stdout.split() | length >= 1)
         else '' }}

- name: Decide whether helm needs installing
  ansible.builtin.set_fact:
    binaries_helm_needs_install: >-
      {{ ((binaries_helm_installed == '')
          or (binaries_helm_installed is version(binaries_helm_version, '<'))) | bool }}

- name: Probe the installed kubectl version
  ansible.builtin.command:
    argv:
      - "{{ binaries_opt_root }}/kubectl/kubectl"
      - version
      - --client
      - -o
      - json
  register: binaries_kubectl_probe
  changed_when: false
  failed_when: false

- name: Record the installed kubectl version
  ansible.builtin.set_fact:
    binaries_kubectl_installed: >-
      {{ (((binaries_kubectl_probe.stdout | from_json).get('clientVersion', {}).get('gitVersion', ''))
          | regex_replace('^v', ''))
         if (binaries_kubectl_probe.rc == 0 and binaries_kubectl_probe.stdout | length > 0)
         else '' }}

- name: Decide whether kubectl needs installing
  ansible.builtin.set_fact:
    binaries_kubectl_needs_install: >-
      {{ ((binaries_kubectl_installed == '')
          or (binaries_kubectl_installed is version(binaries_kubectl_version, '<'))) | bool }}

- name: Create the sops staging directory
  ansible.builtin.tempfile:
    state: directory
    path: "{{ binaries_opt_root }}"
  register: binaries_sops_tmp
  when: binaries_sops_needs_install

- name: Download sops
  ansible.builtin.get_url:
    url: "{{ binaries_sops_url }}"
    dest: "{{ binaries_sops_tmp.path }}/sops"
    checksum: "sha256:{{ binaries_sops_sha256 }}"
    mode: "0755"
  when: binaries_sops_needs_install

- name: Ensure the sops tool root exists
  ansible.builtin.file:
    path: "{{ binaries_opt_root }}/sops"
    state: directory
    mode: "0755"
  when: binaries_sops_needs_install

- name: Install sops atomically
  ansible.builtin.command:
    argv:
      - mv
      - -f
      - "{{ binaries_sops_tmp.path }}/sops"
      - "{{ binaries_opt_root }}/sops/sops"
  when: binaries_sops_needs_install
  changed_when: true

- name: Remove the sops staging directory
  ansible.builtin.file:
    path: "{{ binaries_sops_tmp.path }}"
    state: absent
  when: binaries_sops_needs_install

- name: Create the helm staging directory
  ansible.builtin.tempfile:
    state: directory
    path: "{{ binaries_opt_root }}"
  register: binaries_helm_tmp
  when: binaries_helm_needs_install

- name: Download the Helm release
  ansible.builtin.get_url:
    url: "{{ binaries_helm_url }}"
    dest: "{{ binaries_helm_tmp.path }}/helm.tar.gz"
    checksum: "sha256:{{ binaries_helm_sha256 }}"
    mode: "0644"
  when: binaries_helm_needs_install

- name: Create the Helm extraction directory
  ansible.builtin.file:
    path: "{{ binaries_helm_tmp.path }}/extract"
    state: directory
    mode: "0755"
  when: binaries_helm_needs_install

- name: Extract the Helm release
  ansible.builtin.unarchive:
    src: "{{ binaries_helm_tmp.path }}/helm.tar.gz"
    dest: "{{ binaries_helm_tmp.path }}/extract"
    remote_src: true
    extra_opts:
      - --strip-components=1
  when: binaries_helm_needs_install

- name: Ensure the helm tool root exists
  ansible.builtin.file:
    path: "{{ binaries_opt_root }}/helm"
    state: directory
    mode: "0755"
  when: binaries_helm_needs_install

- name: Install the helm binary atomically
  ansible.builtin.command:
    argv:
      - mv
      - -f
      - "{{ binaries_helm_tmp.path }}/extract/helm"
      - "{{ binaries_opt_root }}/helm/helm"
  when: binaries_helm_needs_install
  changed_when: true

- name: Remove the helm staging directory
  ansible.builtin.file:
    path: "{{ binaries_helm_tmp.path }}"
    state: absent
  when: binaries_helm_needs_install

- name: Create the kubectl staging directory
  ansible.builtin.tempfile:
    state: directory
    path: "{{ binaries_opt_root }}"
  register: binaries_kubectl_tmp
  when: binaries_kubectl_needs_install

- name: Download kubectl
  ansible.builtin.get_url:
    url: "{{ binaries_kubectl_url }}"
    dest: "{{ binaries_kubectl_tmp.path }}/kubectl"
    checksum: "sha256:{{ binaries_kubectl_sha256 }}"
    mode: "0755"
  when: binaries_kubectl_needs_install

- name: Ensure the kubectl tool root exists
  ansible.builtin.file:
    path: "{{ binaries_opt_root }}/kubectl"
    state: directory
    mode: "0755"
  when: binaries_kubectl_needs_install

- name: Install kubectl atomically
  ansible.builtin.command:
    argv:
      - mv
      - -f
      - "{{ binaries_kubectl_tmp.path }}/kubectl"
      - "{{ binaries_opt_root }}/kubectl/kubectl"
  when: binaries_kubectl_needs_install
  changed_when: true

- name: Remove the kubectl staging directory
  ansible.builtin.file:
    path: "{{ binaries_kubectl_tmp.path }}"
    state: absent
  when: binaries_kubectl_needs_install

- name: Link the standalone binaries into ~/.local/bin
  ansible.builtin.include_role:
    name: path_links
  vars:
    path_links_links: "{{ binaries_path_links }}"
